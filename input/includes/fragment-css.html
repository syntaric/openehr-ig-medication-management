<!--
  IG override of the openEHR template's fragment-css.html (copied from it, plus the style below).
  If the template's version changes, copy its new content in here.
  WebTemplate table: show a node's AQL path in a pop-up when hovering over its name.
  The pop-up (span.wt-aql) is generated by the patched WebTemplateRenderer and hidden inline.
-->
<style>
  .wt-name { position: relative; }
  .wt-name > .wt-aql {
    position: absolute; left: 0; top: 100%; z-index: 20;
    width: max-content; max-width: min(60vw, 700px);
    padding: 3px 6px; border: 1px solid #c8c8c8; border-radius: 3px;
    background: #fffbe6; color: #222; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    font-family: Menlo, Consolas, monospace; font-size: 11px; line-height: 1.4;
    white-space: normal; overflow-wrap: anywhere; cursor: text; user-select: text;
  }
  .wt-name:hover > .wt-aql { display: block !important; }
</style>
